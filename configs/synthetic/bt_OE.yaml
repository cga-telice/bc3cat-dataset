# BT sobre STACKED (opción A). Decisiones de César en CP1 (2026-10-04):
# valores por defecto del handoff §3, siglas enmascaradas.
seed: 42
handoff_dir: data/synthetic/handoff_OE
stage_json: data/synthetic/intermediate/OE_2026_stage.json
stacked_sidecar: data/synthetic/processed_OE_ablation_stacked/BC3CAT_Syn_modifications.jsonl
menus_dir: data/synthetic/menus_OE

# Extractores G2: en secuencia, nunca a la vez en GPU.
extractors: [phi4:latest, qwen2.5:14b]
llm_base_url: http://localhost:11434/v1
llm_timeout: 300
# JSON estricto (response_format json_object); v3 lleva citas, de ahí 384
llm_max_tokens: 384
cache_root: data/synthetic/llm_cache

calibration:
  per_concept: 8
  thresholds: {positives: 0.995, discrimination: 0.99, ablation: 0.99, drift: 1.0, stability: 1.0}
  report: docs/synthetic/bt/OE_characterization_calibration.md
  output_json: data/synthetic/bt_OE/OE_characterization_calibration.json

bt:
  pivot: en
  engine: marian
  model_es_en: Helsinki-NLP/opus-mt-es-en
  revision_es_en: c96e2c5399ebfae4fc43d9669556b9afa74bb69d
  model_en_es: Helsinki-NLP/opus-mt-en-es
  revision_en_es: 5bc4493d463cf000c1f0b50f8d56886a392ed4ab
  license: apache-2.0
  decoding: {num_beams: 4, do_sample: false, max_new_tokens: 512}
  batch_size: 16
  # Estrategia de máscara: la decide el miniexperimento de T4 (bt_mask_experiment.py).
  mask_strategy: bracket
  mask_strategies: [sentinel, xml, bracket]
  mask_experiment_size: 100
  pilot_size: 300
  audit_bt_orig: 50
  stacked_p_keys: data/synthetic/bt_OE/OE_stacked_P_keys.json
  cache_dir: data/synthetic/bt_OE/cache
  out_dir: data/synthetic/bt_OE
  # Glosario: términos del oficio que salen literales en la BT de prosa. Sale de la
  # auditoría de las 82 prosas de bt_origv (2026-10-15): son los que el traductor
  # confundía (arqueta → arco, canaleta → canal, desmonte → despeje, hastial → hestial…),
  # más sus parejas que distinguen partidas (desmonte ↔ terraplén).
  glossary: [arqueta, canaleta, cimentación, desmonte, terraplén, cata, macizo, tapa, tapado,
             destapado, mandrilado, hastial, zanja, ménsula, micropilote, topo, acometida,
             embocadura, hito, ficha, firme, talud, hinca, trinchera, cuneta, balasto, repartidor]

# BT de valores (vuelta tras CP4): ES→EN→X→ES por valor, tabla cerrada revisada por César.
bt_values:
  pivots: [fr, it, de]
  models:
    es-en: [Helsinki-NLP/opus-mt-es-en, c96e2c5399ebfae4fc43d9669556b9afa74bb69d]
    en-fr: [Helsinki-NLP/opus-mt-en-fr, dd7f6540a7a48a7f4db59e5c0b9c42c8eea67f18]
    fr-es: [Helsinki-NLP/opus-mt-fr-es, f4263aff464dbfb2650a4b1793baf6f82b91ae91]
    en-it: [Helsinki-NLP/opus-mt-en-it, be5a254d936f1a8c8da080406ca582a6615e6658]
    it-es: [Helsinki-NLP/opus-mt-it-es, bf60834fa2d3999a6bedf4f3ea27bd9e4daa6407]
    en-de: [Helsinki-NLP/opus-mt-en-de, 6183067f769a302e3861815543b9f312c71b0ca4]
    de-es: [Helsinki-NLP/opus-mt-de-es, 0c0187af74abb222c9d53a672e41dec7dc867b3f]
  licenses: {en-de: cc-by-4.0, default: apache-2.0}
  cache_dir: data/synthetic/bt_OE/cache_values
  table: data/synthetic/bt_OE/OE_bt_value_candidates.jsonl
  menu: docs/synthetic/bt/OE_bt_value_menu.md
  label_probability: 0.5
  # tope de generación = 2 × tokens de entrada + 16 (las salidas degeneradas llegaban a 512)
  length_ratio: 2.0
  # L2: se descartan las variantes que pierden un término de dominio (palabra en <= 35 % de los conceptos)
  domain_max_df: 0.35
  domain_terms: data/synthetic/bt_OE/OE_bt_domain_terms.json
  # Auditoría por agentes con contexto limpio (un veredicto A/R por casilla), muestra para César
  verdicts: [data/synthetic/bt_OE/OE_bt_value_verdicts_L1.jsonl, data/synthetic/bt_OE/OE_bt_value_verdicts_L2.jsonl]
  menu_marked: docs/synthetic/bt/OE_bt_value_menu_marked.md
  approved: data/synthetic/bt_OE/OE_bt_value_approved.json
  sample: docs/synthetic/bt/OE_bt_value_audit_sample.md

# BT de prosa por frases con candidatas y restauración posterior del glosario (sobre bt_origv)
bt_sentences:
  chains: [en, en-fr, en-it, en-de]
  extra_glossary: [poste, corrugada, composite, solera, recibido, adecuación]
  audit: docs/synthetic/bt/OE_bt_origv_sentence_audit.md
  index: data/synthetic/bt_OE/OE_bt_origv_sentence_index.json
  verdicts: data/synthetic/bt_OE/OE_bt_origv_sentence_verdicts.jsonl
  output: data/synthetic/bt_OE/OE_bt_origv_sentences_en_texto.json
  rejected: data/synthetic/bt_OE/OE_bt_origv_sentences_rejected.jsonl
