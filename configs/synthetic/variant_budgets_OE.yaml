# Phase 2 — OE synthetic corpus budgets (BPA 2026 base).
#
# Option A: leaf-proportional allocation. Each concept receives a total item
# budget proportional to its share of leaves in the (deduplicated) target pool,
# clamped to [floor, cap_per_leaf*leaves]. That per-concept budget is split
# across the 10 conditions by `type_mix`; any single-type shortfall (e.g. L2
# paraphrase/expansion on list-form variables) is absorbed by the SAME concept's
# all_combined, so a shortfall never leaks to another concept. This keeps items
# per concept ∝ leaves (fixing OED under-representation) while a coverage floor
# keeps small concepts measurable (macro-average / per-stratum reporting).
#
# Generate from the DEDUPED target pool (OE_target_{long,short}.parquet) so the
# corpus is duplicate-clean by construction (no OED170, no OEG010 dup leaves).
seed: 42
mode: leaf_proportional
total: 5000
floor: 5              # min items per concept (coverage); applied once, not per-condition
cap_per_leaf: 3.0     # safety rail on items per concept (rarely binds; floor dominates tiny concepts)
type_mix:             # desired share of each condition (renormalised per concept over eligible types)
  single_paraphrase: 0.088
  single_expansion: 0.088
  single_template_paraphrase: 0.133
  single_synonym_label: 0.088
  single_compression: 0.088
  single_reorder: 0.133
  single_num_to_text: 0.053
  single_unit_expansion: 0.053
  single_unit_conversion: 0.035
  all_combined: 0.239
reuse_cap:
  num_to_text: 20
  unit_expansion: 20
  unit_conversion: 20
